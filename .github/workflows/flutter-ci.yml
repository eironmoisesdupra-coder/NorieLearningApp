name: Flutter CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: anatomy_viewer/package-lock.json

      - uses: actions/cache@v4
        with:
          path: build/anatomy-research
          key: anatomy-sources-${{ hashFiles('scripts/anatomy/sources.json') }}
          restore-keys: anatomy-sources-

      - name: Generate Android and web platform scaffolding
        run: flutter create --platforms=android,web --project-name norie_learning .

      - name: Apply Norie platform branding
        run: |
          cp branding/web/index.html web/index.html
          cp branding/web/manifest.json web/manifest.json
          cp branding/web/norie-logo.svg web/norie-logo.svg
          cp branding/web/norie-sw.js web/norie-sw.js
          cp branding/web/norie-updates.mjs web/norie-updates.mjs
          cp branding/web/downloads.html web/downloads.html
          cp branding/web/downloads.mjs web/downloads.mjs
          mkdir -p android/app/src/main/res/drawable
          cp branding/android/norie_launcher_icon.xml android/app/src/main/res/drawable/norie_launcher_icon.xml
          cp branding/android/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: Remove generated default test
        run: rm -f test/widget_test.dart

      - name: Fetch licensed offline music
        run: python scripts/fetch_music_assets.py

      - name: Fetch anatomy 3D assets
        run: bash scripts/fetch_anatomy_assets.sh

      - name: Configure Android for 3D viewer
        run: |
          python - <<'PY'
          from pathlib import Path

          gradle = Path("android/app/build.gradle.kts")
          text = gradle.read_text()
          old = "minSdk = flutter.minSdkVersion"
          if old not in text:
              raise SystemExit("Could not find Flutter minSdk declaration")
          gradle.write_text(text.replace(old, "minSdk = 24"))
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Test offline web cache
        run: |
          node --test test/norie_service_worker_test.mjs test/norie_updates_test.mjs test/downloads_test.mjs test/release_shell_test.mjs
          python -m unittest discover -s test -p release_tools_test.py

      - name: Install local AI test dependencies
        working-directory: local-ai
        run: npm ci --no-audit --no-fund

      - name: Test source-based study generation and local AI
        run: node --test test/study_generation_test.mjs test/local_ai_test.mjs

      - name: Verify licensed audio assets and downloader
        run: |
          python -m unittest discover -s test -p music_assets_test.py
          node --test desktop/test/audio-assets.test.cjs

      - name: Verify detailed atlas
        run: |
          python -m unittest discover -s test -p anatomy_pipeline_test.py
          node --test anatomy_viewer/test/*.test.mjs
          python scripts/anatomy/catalog.py

      - name: Verify Android launcher branding
        run: |
          grep -q 'android:label="NorieLearning"' android/app/src/main/AndroidManifest.xml
          grep -q '@drawable/norie_launcher_icon' android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/res/drawable/norie_launcher_icon.xml

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload branded Android APK
        uses: actions/upload-artifact@v4
        with:
          name: NorieLearning-android-release
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Verify offline web configuration
        run: |
          grep -q 'norie-updates.mjs' branding/web/index.html
          grep -q 'overview-skeleton.glb' branding/web/norie-sw.js
          if grep -q 'registration.unregister' branding/web/index.html; then
            echo "Offline mode must not unregister service workers" >&2
            exit 1
          fi
          if grep -q 'caches.delete' branding/web/index.html; then
            echo "Offline mode must not clear browser caches on startup" >&2
            exit 1
          fi

      - name: Build web release
        run: flutter build web --release --no-web-resources-cdn

      - name: Verify offline web artifacts
        run: |
          test -f build/web/norie-sw.js
          test -f build/web/assets/assets/anatomy/overview-skeleton.glb
          test -f build/web/assets/assets/anatomy/anatomy-organs.glb
          test -f build/web/assets/packages/model_viewer_plus/assets/model-viewer.min.js
          test -d build/web/canvaskit
