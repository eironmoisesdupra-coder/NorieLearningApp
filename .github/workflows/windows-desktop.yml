name: Windows Desktop

on:
  workflow_dispatch:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

jobs:
  offline-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Prepare web platform and branding
        shell: pwsh
        run: |
          flutter create --no-pub --platforms=web --project-name norie_learning .
          Copy-Item branding/web/* web/ -Force
          Remove-Item test/widget_test.dart -ErrorAction SilentlyContinue
      - uses: actions/cache@v4
        with:
          path: build/anatomy-research
          key: anatomy-sources-${{ hashFiles('scripts/anatomy/sources.json') }}
          restore-keys: anatomy-sources-
      - name: Fetch licensed offline music
        run: python scripts/fetch_music_assets.py

      - name: Fetch licensed anatomy assets
        shell: bash
        run: bash scripts/fetch_anatomy_assets.sh
      - name: Build bundled Flutter app
        run: |
          flutter pub get --enforce-lockfile
          flutter build web --no-pub --release --base-href "/" --no-web-resources-cdn
      - name: Install desktop build dependencies
        working-directory: desktop
        run: npm ci --no-audit --no-fund
      - name: Test desktop asset boundaries
        working-directory: desktop
        run: npm test
      - name: Verify browser updates preserve offline progress across tabs
        run: node desktop/test/web-update.cjs
      - name: Verify classroom file exchange and seasonal navigation
        run: node desktop/test/classroom-seasonal-web.cjs
      - name: Verify private diagnostics export and offline reward controls
        run: node desktop/test/economy-diagnostics-web.cjs
      - name: Exercise every atlas system with networking blocked
        run: |
          node anatomy_viewer/test/browser-smoke.mjs
          node anatomy_viewer/test/browser-interactions.mjs
          node anatomy_viewer/test/browser-performance.mjs
      - name: Package Windows app
        working-directory: desktop
        run: npm run package:windows
      - name: Verify packaged LAN classroom with a native Dart learner
        working-directory: desktop
        run: |
          flutter precache --windows
          npm run test:lan
      - name: Verify offline audio playback and persisted settings
        working-directory: desktop
        run: npm run test:audio
      - name: Run packaged app without internet
        working-directory: desktop
        run: npm run test:offline
      - name: Zip complete portable app
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows-desktop/NorieLearning-win32-x64 -DestinationPath build/NorieLearning-Windows.zip
      - name: Audit exact Windows ZIP against reviewed preview budget
        run: python scripts/release/asset_budget.py --windows build/NorieLearning-Windows.zip --json-output build/windows-package-size-report.json --fail-on-growth
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-package-size-report
          path: build/windows-package-size-report.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: NorieLearning-Windows-offline
          path: build/NorieLearning-Windows.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Windows-offline-test-screenshots
          path: build/windows-*.png
