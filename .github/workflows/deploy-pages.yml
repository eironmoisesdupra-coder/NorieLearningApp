name: Deploy Web Preview

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: norie-web-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate web platform scaffolding
        run: flutter create --platforms=web --project-name norie_learning .

      - name: Apply Norie web branding
        run: |
          cp branding/web/index.html web/index.html
          cp branding/web/manifest.json web/manifest.json
          cp branding/web/norie-logo.svg web/norie-logo.svg

      - name: Remove generated default test
        run: rm -f test/widget_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Build web preview
        run: flutter build web --release --base-href "/NorieLearningApp/"

      - name: Make preview cache-safe
        env:
          NORIE_BUILD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          build = Path("build/web")
          bootstrap = build / "flutter_bootstrap.js"
          text = bootstrap.read_text()

          sha = os.environ["NORIE_BUILD_SHA"]
          text = text.replace(
              '"mainJsPath":"main.dart.js"',
              f'"mainJsPath":"main.dart.js?v={sha}"',
          )
          text = re.sub(
              r'_flutter\.loader\.load\(\{\s*serviceWorkerSettings:\s*\{.*?\}\s*\}\);',
              '_flutter.loader.load();',
              text,
              flags=re.S,
          )
          bootstrap.write_text(text)

          worker = build / "flutter_service_worker.js"
          if worker.exists():
              worker.unlink()
          PY

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: gh-pages
          force_orphan: true
