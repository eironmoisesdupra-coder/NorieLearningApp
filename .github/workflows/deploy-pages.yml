name: Deploy Web Preview

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: norie-web-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate web platform scaffolding
        run: flutter create --platforms=web --project-name norie_learning .

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: anatomy_viewer/package-lock.json

      - uses: actions/cache@v4
        with:
          path: build/anatomy-research
          key: anatomy-sources-${{ hashFiles('scripts/anatomy/sources.json') }}
          restore-keys: anatomy-sources-

      - name: Apply Norie web branding
        run: |
          cp branding/web/index.html web/index.html
          cp branding/web/manifest.json web/manifest.json
          cp branding/web/norie-logo.svg web/norie-logo.svg
          cp branding/web/norie-sw.js web/norie-sw.js

      - name: Remove generated default test
        run: rm -f test/widget_test.dart

      - name: Fetch licensed offline music
        run: python scripts/fetch_music_assets.py

      - name: Fetch anatomy 3D assets
        run: bash scripts/fetch_anatomy_assets.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Build web preview
        run: flutter build web --release --base-href "/NorieLearningApp/" --no-web-resources-cdn

      - name: Prepare offline-safe preview
        env:
          NORIE_BUILD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          build = Path("build/web")
          sha = os.environ["NORIE_BUILD_SHA"]

          bootstrap = build / "flutter_bootstrap.js"
          bootstrap_text = bootstrap.read_text()
          bootstrap_text = bootstrap_text.replace(
              '"mainJsPath":"main.dart.js"',
              f'"mainJsPath":"main.dart.js?v={sha}"',
          )
          bootstrap_text = re.sub(
              r'_flutter\.loader\.load\(\{\s*serviceWorkerSettings:\s*\{.*?\}\s*\}\);',
              '_flutter.loader.load();',
              bootstrap_text,
              flags=re.S,
          )
          bootstrap.write_text(bootstrap_text)

          generated_worker = build / "flutter_service_worker.js"
          if generated_worker.exists():
              generated_worker.unlink()

          required = [
              build / "index.html",
              build / "flutter_bootstrap.js",
              build / "main.dart.js",
              build / "norie-sw.js",
              build / "assets/assets/anatomy/overview-skeleton.glb",
              build / "assets/assets/anatomy/anatomy-organs.glb",
              build / "assets/packages/model_viewer_plus/assets/model-viewer.min.js",
          ]
          missing = [str(path) for path in required if not path.exists()]
          if missing:
              raise SystemExit("Missing offline prerequisite(s): " + ", ".join(missing))

          extra = []
          patterns = [
              "canvaskit/**/*",
              "assets/**/*",
          ]
          for pattern in patterns:
              for path in build.glob(pattern):
                  if path.is_file():
                      extra.append("./" + path.relative_to(build).as_posix())

          for name in ("flutter.js",):
              path = build / name
              if path.exists():
                  extra.append("./" + name)

          extra = sorted(set(extra))

          sw = build / "norie-sw.js"
          sw_text = sw.read_text()
          sw_text = sw_text.replace("__NORIE_BUILD_SHA__", sha)
          injected_assets = ",\n  ".join(json.dumps(path) for path in extra)
          sw_text = sw_text.replace(
              "/*__NORIE_EXTRA_ASSETS__*/",
              injected_assets,
          )
          sw.write_text(sw_text)

          index = build / "index.html"
          index_text = index.read_text().replace("__NORIE_BUILD_SHA__", sha)
          index.write_text(index_text)
          PY

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: gh-pages
          force_orphan: true
