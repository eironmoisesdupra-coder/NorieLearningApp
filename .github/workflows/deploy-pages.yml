name: Deploy Web Preview

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full merged source SHA explicitly approved by the owner
        required: true
        type: string
      tag:
        description: Version tag matching the approved source (for example v0.19.0)
        required: true
        type: string
      approve_publication:
        description: Owner approved publishing this exact source revision
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  actions: read

concurrency:
  group: norie-web-preview
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop' && inputs.approve_publication
    runs-on: ubuntu-latest

    steps:
      - name: Checkout trusted publication gate
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false

      - name: Require explicit approval of an integrated source revision
        env:
          APPROVED_REVISION: ${{ inputs.revision }}
          APPROVED_TAG: ${{ inputs.tag }}
          APPROVED_PUBLICATION: ${{ inputs.approve_publication }}
        run: python scripts/release/preview_approval.py --revision "$APPROVED_REVISION" --tag "$APPROVED_TAG" --approved "$APPROVED_PUBLICATION"

      - name: Require successful trusted CI for the approved revision
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_REVISION: ${{ inputs.revision }}
          APPROVED_TAG: ${{ inputs.tag }}
        run: python scripts/release/prepare_release.py gate --tag "$APPROVED_TAG" --revision "$APPROVED_REVISION"

      - name: Checkout only the approved source
        env:
          APPROVED_REVISION: ${{ inputs.revision }}
        run: git checkout --detach "$APPROVED_REVISION"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true

      - name: Generate web platform scaffolding
        run: flutter create --no-pub --platforms=web --project-name norie_learning .

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: anatomy_viewer/package-lock.json

      - uses: actions/cache@v4
        with:
          path: build/anatomy-research
          key: anatomy-sources-${{ hashFiles('scripts/anatomy/sources.json') }}
          restore-keys: anatomy-sources-

      - name: Apply Norie web branding
        run: |
          cp branding/web/index.html web/index.html
          cp branding/web/manifest.json web/manifest.json
          cp branding/web/norie-logo.svg web/norie-logo.svg
          cp branding/web/norie-sw.js web/norie-sw.js
          cp branding/web/norie-updates.mjs web/norie-updates.mjs
          cp branding/web/downloads.html web/downloads.html
          cp branding/web/downloads.mjs web/downloads.mjs

      - name: Remove generated default test
        run: rm -f test/widget_test.dart

      - name: Fetch licensed offline music
        run: python scripts/fetch_music_assets.py

      - name: Fetch anatomy 3D assets
        run: bash scripts/fetch_anatomy_assets.sh

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build web preview
        run: flutter build web --no-pub --release --base-href "/NorieLearningApp/" --no-web-resources-cdn

      - name: Prepare offline-safe preview
        env:
          NORIE_BUILD_SHA: ${{ inputs.revision }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          build = Path("build/web")
          sha = os.environ["NORIE_BUILD_SHA"]

          bootstrap = build / "flutter_bootstrap.js"
          bootstrap_text = bootstrap.read_text()
          bootstrap_text = bootstrap_text.replace(
              '"mainJsPath":"main.dart.js"',
              f'"mainJsPath":"main.dart.js?v={sha}"',
          )
          bootstrap_text = re.sub(
              r'_flutter\.loader\.load\(\{\s*serviceWorkerSettings:\s*\{.*?\}\s*\}\);',
              '_flutter.loader.load();',
              bootstrap_text,
              flags=re.S,
          )
          bootstrap.write_text(bootstrap_text)

          generated_worker = build / "flutter_service_worker.js"
          if generated_worker.exists():
              generated_worker.unlink()

          required = [
              build / "index.html",
              build / "flutter_bootstrap.js",
              build / "main.dart.js",
              build / "norie-sw.js",
              build / "assets/assets/anatomy/overview-skeleton.glb",
              build / "assets/assets/anatomy/anatomy-organs.glb",
              build / "assets/packages/model_viewer_plus/assets/model-viewer.min.js",
          ]
          missing = [str(path) for path in required if not path.exists()]
          if missing:
              raise SystemExit("Missing offline prerequisite(s): " + ", ".join(missing))

          extra = []
          patterns = [
              "canvaskit/**/*",
              "assets/**/*",
          ]
          for pattern in patterns:
              for path in build.glob(pattern):
                  if path.is_file():
                      extra.append("./" + path.relative_to(build).as_posix())

          for name in ("flutter.js",):
              path = build / name
              if path.exists():
                  extra.append("./" + name)

          extra = sorted(set(extra))

          sw = build / "norie-sw.js"
          sw_text = sw.read_text()
          sw_text = sw_text.replace("__NORIE_BUILD_SHA__", sha)
          injected_assets = ",\n  ".join(json.dumps(path) for path in extra)
          sw_text = sw_text.replace(
              "/*__NORIE_EXTRA_ASSETS__*/",
              injected_assets,
          )
          sw.write_text(sw_text)

          index = build / "index.html"
          index_text = index.read_text().replace("__NORIE_BUILD_SHA__", sha)
          index.write_text(index_text)
          PY

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: gh-pages
          force_orphan: true
