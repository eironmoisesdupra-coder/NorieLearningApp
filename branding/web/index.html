<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="NorieLearning — Play, learn, and grow further.">
  <meta name="theme-color" content="#071126">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NorieLearning">
  <link rel="icon" type="image/svg+xml" href="norie-logo.svg">
  <link rel="manifest" href="manifest.json">
  <script type="module" src="./assets/packages/model_viewer_plus/assets/model-viewer.min.js" defer></script>
  <title>NorieLearning</title>
</head>
<body>
  <script>
    (() => {
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', async () => {
          try {
            const registration = await navigator.serviceWorker.register(
              'norie-sw.js?v=__NORIE_BUILD_SHA__',
              { scope: './' },
            );
            await registration.update();
          } catch (error) {
            console.warn('Norie offline cache registration warning:', error);
          }
        });
      }

      const script = document.createElement('script');
      script.src = 'flutter_bootstrap.js?v=__NORIE_BUILD_SHA__';
      script.async = true;
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
