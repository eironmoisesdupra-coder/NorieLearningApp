<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="NorieLearning — Play, learn, and grow further.">
  <meta name="theme-color" content="#071126">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NorieLearning">
  <link rel="icon" type="image/svg+xml" href="norie-logo.svg">
  <link rel="manifest" href="manifest.json">
  <script type="module" src="./assets/packages/model_viewer_plus/assets/model-viewer.min.js" defer></script>
  <title>NorieLearning</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #071126;
      color: #eef4ff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }
    #norie-bootstrap {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #071126;
      z-index: 999999;
    }
    #norie-bootstrap-card {
      width: min(86vw, 340px);
      text-align: center;
      line-height: 1.45;
      color: #b9c7df;
    }
    #norie-bootstrap-title {
      color: #eef4ff;
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 8px;
    }
    #norie-bootstrap-note {
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div id="norie-bootstrap" aria-live="polite">
    <div id="norie-bootstrap-card">
      <div id="norie-bootstrap-title">Opening NorieLearning…</div>
      <div id="norie-bootstrap-note">
        Preparing offline access while the app loads.
      </div>
    </div>
  </div>

  <script>
    (() => {
      const startOfflineCache = () => {
        if (!('serviceWorker' in navigator)) return;
        const notice = document.createElement('div');
        notice.setAttribute('role', 'status');
        notice.style.cssText = 'position:fixed;bottom:12px;right:12px;z-index:9999;max-width:260px;padding:10px 14px;border-radius:12px;background:#142641;color:#e5f5ff;font:12px system-ui;pointer-events:none';
        notice.textContent = 'Saving the offline learning library…';
        document.body.appendChild(notice);
        const watch = (worker) => {
          if (!worker) return;
          const changed = () => {
            if (worker.state === 'activated') {
              notice.textContent = 'Offline learning library ready';
              setTimeout(() => notice.remove(), 5000);
            } else if (worker.state === 'redundant') {
              notice.textContent = 'Offline setup incomplete. Reopen while connected to retry.';
            }
          };
          worker.addEventListener('statechange', changed);
          changed();
        };

        navigator.serviceWorker.register(
          'norie-sw.js?v=__NORIE_BUILD_SHA__',
          { scope: './' },
        ).then((registration) => {
          watch(registration.installing || registration.waiting || registration.active);
          registration.addEventListener('updatefound', () => watch(registration.installing));
          registration.update().catch(() => {});
        }).catch((error) => {
          notice.textContent = 'Offline setup unavailable. Reopen while connected to retry.';
          console.warn('Norie offline cache registration warning:', error);
        });
      };

      // Start offline setup as soon as the HTML shell arrives. Do not wait for
      // Flutter to finish loading first.
      startOfflineCache();

      const script = document.createElement('script');
      script.src = 'flutter_bootstrap.js?v=__NORIE_BUILD_SHA__';
      script.async = true;
      script.onload = () => {
        const splash = document.getElementById('norie-bootstrap');
        if (splash) {
          setTimeout(() => splash.remove(), 1200);
        }
      };
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
