name: norie_learning
description: A modern gamified learning platform for students and professionals.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  supabase_flutter: ^2.9.1
  file_picker: ^13.1.0
  audioplayers: ^6.8.1
  flutter_3d_controller: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/mascot/
    - assets/achievements/
    - assets/ranking/
    - assets/anatomy/
